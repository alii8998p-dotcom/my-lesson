؟ چرا؟","x":"معیار گرایش به مرکز مناسب «میانه» و معیار پراکندگی مناسب «دامنه میان‌چارکی» است؛ زیرا در بین داده‌ها اعداد ۲۸ و ۳۰ به عنوان داده‌های دورافتاده وجود دارند که باعث گمراه‌کننده شدن میانگین و انحراف معیار می‌شوند.","d":"شهریور ۱۴۰۲","t":"fb","a":"میانه معیار گرایش به مرکز مناسب و دامنه میان‌چارکی معیار پراکندگی مناسب است؛ چون در میان داده‌ها، دو داده دورافتاده مانند ۳۰ و ۲۸ وجود دارد."},{"i":67,"q":"درصد قبولی دانش‌آموزان دو مدرسه A و B در درس ریاضی، به ترتیب ۶۵ درصد و ۸۰ درصد بوده است. تعداد قبولی دانش‌آموزان کدام مدرسه بیشتر است؟ چرا؟","x":"نمی‌توان نظر داد که تعداد قبولی کدام مدرسه بیشتر است؛ زیرا تعداد کل دانش‌آموزان هر مدرسه مشخص نیست و در داده‌های کیفی گزارش درصد بدون گزارش تعداد کل می‌تواند گمراه‌کننده باشد.","d":"دی ۱۴۰۱","t":"fb","a":"نمی‌توان نظری داد؛ چون گزارش درصد باید همیشه با گزارش تعداد همراه باشد."},{"i":68,"q":"داده‌های زیر، میزان حقوق ماهیانه (بر حسب میلیون تومان) کارمندان یک شرکت خصوصی را نشان می‌دهد: ۱۰ و ۱۲ و ۳۵ و ۸ و ۹ و ۲۰ و ۱۱ و ۵ و ۶ و ۶ و ۸. الف) دامنه تغییرات و میانه داده‌های بالا را به دست آورید. ب) آیا میانه معیار گرایش به مرکز مناسبی برای توصیف این داده‌هاست؟ چرا؟","x":"الف) داده‌های مرتب‌شده: 5, 6, 6, 8, 8, 9, 10, 11, 12, 20, 35 (۱۱ داده). دامنه تغییرات: 35 - 5 = 30. میانه (داده ششم): 9. ب) بله، زیرا عدد ۳۵ یک داده دورافتاده است و میانه تحت تأثیر آن قرار نمی‌گیرد.","d":"خرداد ۱۴۰۱","t":"fb","a":"الف) دامنه تغییرات: 35 - 5 = 30، میانه: 9  ب) بله؛ زیرا در بین داده‌ها، داده دورافتاده وجود دارد."},{"i":69,"q":"در نمونه‌گیری زیر میزان مصرف برق ۹ خانوار در یک دوره (بر حسب کیلووات ساعت) به دست آمده است؛ میانه، چارک اول و چارک سوم را مشخص کنید: 140, 280, 170, 130, 140, 320, 190, 165, 230","x":"داده‌های مرتب‌شده (۹ داده): 130, 140, 140, 165, 170, 190, 230, 280, 320. میانه (داده پنجم): 170. نیمه پایین: {130, 140, 140, 165} -> چارک اول: (140 + 140)/2 = 140. نیمه بالا: {190, 230, 280, 320} -> چارک سوم: (230 + 280)/2 = 255.","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"میانه: 170، چارک اول: 140، چارک سوم: 255"},{"i":70,"q":"در یک مطالعه آماری، برای اندازه‌گیری وزن افراد از دو واحد متفاوت استفاده شده است. الف) این مورد مربوط به اجرای نادرست کدام یک از گام‌های چرخه آمار در حل مسائل است؟ ب) این اجرای نادرست بر کدام گام‌های این چرخه اثر می‌گذارد؟","x":"الف) گام دوم چرخه آمار (طرح و برنامه‌ریزی) به درستی اجرا نشده است. ب) این خطا بر گام سوم (گردآوری داده‌ها)، گام چهارم (تحلیل داده‌ها) و گام پنجم (بحث و نتیجه‌گیری) اثر منفی می‌گذارد.","d":"شهریور ۱۴۰۱","t":"fb","a":"الف) گام دوم: طرح و برنامه‌ریزی  ب) بر روی گام سوم، گام چهارم و گام پنجم اثر می‌گذارد."},{"i":71,"q":"برای بررسی میزان مطالعه افراد یک شهر، آیا انتخاب نمونه از بین افراد عضو کتابخانه عمومی آن شهر، روش نمونه‌گیری مناسبی است؟ چرا؟","x":"خیر؛ زیرا اعضای کتابخانه نماینده و معرف تمام مردم شهر نیستند و افراد غیرعضو هیچ شانسی برای انتخاب شدن ندارند.","d":"شهریور ۱۴۰۱","t":"fb","a":"خیر؛ چون معرف خوبی از جامعه نیستند."},{"i":72,"q":"با توجه به داده‌های زیر، میانگین و میانه آنها را به دست آورید: 3 - 1 - 5 - 7 - 3 - 8 - 2 - 4 - 3 - 4","x":"داده‌های مرتب‌شده (۱۰ داده): 1, 2, 3, 3, 3, 4, 4, 5, 7, 8. میانگین: (1+2+3+3+3+4+4+5+7+8) / 10 = 40 / 10 = 4. میانه (میانگین داده پنجم و ششم): (3 + 4) / 2 = 3.5.","d":"شهریور ۱۴۰۰","t":"fb","a":"میانگین = 40 / 10 = 4، میانه = 3.5"},{"i":73,"q":"در موارد زیر، نام گام را بنویسید: الف) برگزاری آزمون‌های پیشرفت تحصیلی در مدارس و بررسی نمره دانش‌آموزان ب) بررسی علل پایین بودن سرانه مطالعه دانش‌آموزان کشور در مقطع متوسطه دوم","x":"الف) گام دوم: طرح و برنامه‌ریزی (تعیین ابزار و شیوه اندازه‌گیری). ب) گام اول: بیان مسئله.","d":"دی ۹۹","t":"fb","a":"الف) طرح و برنامه‌ریزی  ب) بیان مسئله"},{"i":74,"q":"گام سوم، چهارم و پنجم چرخه آمار را بنویسید.","x":"گام سوم: گردآوری و پاک‌سازی داده‌ها | گام چهارم: تحلیل داده‌ها | گام پنجم: بحث و نتیجه‌گیری.","d":"دی ۹۹ خارج","t":"fb","a":"گام سوم: گردآوری و پاک‌سازی داده‌ها، گام چهارم: تحلیل داده‌ها، گام پنجم: بحث و نتیجه‌گیری"},{"i":75,"q":"مراحل چرخه آماری را نام ببرید و با توجه به آن نام گام زیر را بنویسید: «داده‌ها را گردآوری می‌کنیم و تا حد ممکن از درستی آنها مطمئن می‌شویم.»","x":"مراحل پنج‌گانه چرخه آمار: ۱. بیان مسئله ۲. طرح و برنامه‌ریزی ۳. گردآوری و پاک‌سازی داده‌ها ۴. تحلیل داده‌ها ۵. بحث و نتیجه‌گیری. نام گام مورد نظر: گام سوم (گردآوری و پاک‌سازی داده‌ها).","d":"دی ۹۹ خارج","t":"fb","a":"گام ۱: بیان مسئله، گام ۲: طرح و برنامه‌ریزی، گام ۳: گردآوری و پاک‌سازی داده‌ها، گام ۴: تحلیل داده‌ها، گام ۵: بحث و نتیجه‌گیری | نام گام مورد نظر: گردآوری و پاک‌سازی داده‌ها"},{"i":76,"q":"با توجه به چرخه آماری، نام هر گام را بنویسید: الف) راهی برای رسیدن به پاسخ مسئله پیدا می‌کنیم و به نمونه‌گیری و چگونگی توصیف نتایج می‌اندیشیم. ب) نتایج به دست آمده را تفسیر می‌کنیم و پاسخی برای پرسش اصلی پیدا می‌کنیم.","x":"الف) گام دوم: طرح و برنامه‌ریزی. ب) گام پنجم: بحث و نتیجه‌گیری.","d":"خرداد ۹۹","t":"fb","a":"الف) طرح و برنامه‌ریزی  ب) بحث و نتیجه‌گیری"},{"i":77,"q":"در نمونه‌گیری زیر میزان مصرف آب ۹ خانوار در یک دوره (بر حسب متر مکعب) به دست آمده است. میانه، چارک اول و چارک سوم را مشخص کنید: 130, 65, 75, 120, 50, 30, 70, 110, 40","x":"داده‌های مرتب‌شده (۹ داده): 30, 40, 50, 65, 70, 75, 110, 120, 130. میانه (داده پنجم): 70. نیمه پایین: {30, 40, 50, 65} -> چارک اول: (40 + 50)/2 = 45. نیمه بالا: {75, 110, 120, 130} -> چارک سوم: (110 + 120)/2 = 115.","d":"شهریور ۹۸","t":"fb","a":"میانه: 70، چارک اول: 45، چارک سوم: 115"}]},{"n":"فصل ۲ · مدل‌سازی و دنباله","q":[{"i":1,"q":"یک دنباله، تابعی است که دامنهٔ آن، مجموعهٔ اعداد طبیعی است.","x":"درست؛ طبق تعریف کتاب درسی، دنباله تابعی است که دامنهٔ آن مجموعهٔ اعداد طبیعی ($\\mathbb{N}$) یا زیرمجموعه‌ای از اعداد طبیعی به صورت $1, 2, 3, \\dots, n$ است.","d":"دی ۱۴۰۳","t":"tf","a":true},{"i":2,"q":"یک دنباله، تابعی است که دامنهٔ آن اعداد حقیقی می‌باشد.","x":"نادرست؛ دامنهٔ یک دنباله مجموعهٔ اعداد طبیعی است، نه مجموعهٔ اعداد حقیقی ($\\mathbb{R}$).","d":"دی ۱۴۰۲","t":"tf","a":false},{"i":3,"q":"در دنبالهٔ a_{n+1} = a_n + 3، اگر جملهٔ پنجم ۱۷ باشد، جملهٔ ششم آن ۲۳ است.","x":"نادرست؛ با قرار دادن $n = 5$ در رابطهٔ بازگشتی $a_{n+1} = a_n + 3$ داریم:\n$a_6 = a_5 + 3 = 17 + 3 = 20$\nبنابراین جملهٔ ششم برابر ۲۰ است، نه ۲۳.","d":"خرداد ۱۴۰۱","t":"tf","a":false},{"i":4,"q":"در دنباله با جملهٔ عمومی a_n = n^2 + 1 جمله سوم برابر با ........... است.","x":"با قرار دادن $n = 3$ در جملهٔ عمومی $a_n = n^2 + 1$ داریم:\n$a_3 = 3^2 + 1 = 9 + 1 = 10$","d":"شهریور ۱۴۰۳","t":"fb","a":"۱۰"},{"i":5,"q":"اگر ضابطهٔ دنباله‌ای به صورت a_n = 3n - 5 باشد، جملهٔ ........... دنباله برابر ۲۸- است.","x":"با قرار دادن جملهٔ دنباله در ضابطهٔ $a_n = 3n - 5$ و حل معادله برای $n$:\n$3n - 5 = 28 \\Rightarrow 3n = 33 \\Rightarrow n = 11$\nپس جملهٔ یازدهم (۱۱) مد نظر است.","d":"دی ۱۴۰۲","t":"fb","a":"یازدهم (۱۱)"},{"i":6,"q":"رابطه‌ای را که بیانگر ارتباط جملات دنباله، با یکدیگر است، ........... می‌نامیم.","x":"رابطه‌ای که مقدار هر جملهٔ دنباله را بر حسب یک یا چند جملهٔ قبلی آن بیان کند، **رابطهٔ بازگشتی** نامیده می‌شود.","d":"شهریور ۱۴۰۲","t":"fb","a":"رابطهٔ بازگشتی"},{"i":7,"q":"جملهٔ پنجم دنباله a_n = n^2 - 3، برابر ........... است.","x":"با جایگذاری $n = 5$ در ضابطهٔ $a_n = n^2 - 3$ داریم:\n$a_5 = 5^2 - 3 = 25 - 3 = 22$","d":"دی ۹۸","t":"fb","a":"۲۲"},{"i":8,"q":"در دنبالهٔ -1, -4, -9, ... ضابطهٔ این دنباله ........... می‌باشد.","x":"با بررسی جملات دنباله:\n$a_1 = -1 = -(1^2)$، $a_2 = -4 = -(2^2)$، $a_3 = -9 = -(3^2)$\nبنابراین ضابطهٔ عمومی دنباله به صورت $a_n = -n^2$ است.","d":"خرداد ۹۸","t":"fb","a":"a_n = -n^2"},{"i":9,"q":"ضابطهٔ تابعی دنبالهٔ 1/2, -2/3, 3/4, -4/5, ... کدام گزینه است؟","x":"در دنبالهٔ $\\frac{1}{2}, -\\frac{2}{3}, \\frac{3}{4}, -\\frac{4}{5}, \\dots$:\n- علامت جملات یکی‌درمیان مثبت و منفی است ($a_1 > 0$، $a_2 < 0$، $a_3 > 0$) که با $(-1)^{n+1}$ مدل می‌شود.\n- صورت هر کسر برابر شمارهٔ جمله ($n$) و مخرج آن $n+1$ است.\nپس ضابطهٔ آن $a_n = \\frac{(-1)^{n+1} n}{n+1}$ است که با **گزینه «الف»** مطابقت دارد.","d":"خرداد ۱۴۰۳","t":"fb","a":"گزینه «الف»"},{"i":10,"q":"جملهٔ عمومی دنبالهٔ 2, 5, 8, 11, ... کدام گزینه است؟","x":"دنبالهٔ $2, 5, 8, 11, \\dots$ یک دنبالهٔ حسابی با جملهٔ اول $a_1 = 2$ و اختلاف مشترک $d = 5 - 2 = 3$ است:\n$a_n = a_1 + (n - 1)d = 2 + (n - 1) \\times 3 = 3n - 1$\nکه همان **گزینه «ج»** است.","d":"شهریور ۱۴۰۳","t":"fb","a":"گزینه «ج»"},{"i":11,"q":"جملهٔ عمومی دنبالهٔ 1, 4, 9, 16, ... را بنویسید.","x":"جملات $1, 4, 9, 16, \\dots$ به ترتیب برابر $1^2, 2^2, 3^2, 4^2, \\dots$ هستند؛ بنابراین جملهٔ عمومی آن برابر $a_n = n^2$ است.","d":"خرداد ۱۴۰۴","t":"fb","a":"a_n = n^2"},{"i":12,"q":"با توجه به دنباله‌های a_n = 5^(n-4) و b_n = 6 / (2n - 1):\nالف. حاصل عبارت a_4 - 9b_5 را به دست آورید.\nب. جملات دوم، سوم و چهارم دنبالهٔ بازگشتی a_1 = 1 و a_{n+1} = 2a_n + 1 را بنویسید.","x":"الف) ابتدا مقادیر $a_4$ و $b_5$ را محاسبه می‌کنیم:\n$a_4 = 5^{4-4} = 5^0 = 1$\n$b_5 = \\frac{6}{2(5) - 1} = \\frac{6}{10 - 1} = \\frac{6}{9} = \\frac{2}{3}$\nاکنون حاصل عبارت را می‌یابیم:\n$a_4 - 9b_5 = 1 - 9 \\times \\frac{2}{3} = 1 - 6 = -5$\n\nب) با استفاده از رابطهٔ بازگشتی $a_{n+1} = 2a_n + 1$ و $a_1 = 1$:\n$a_2 = 2a_1 + 1 = 2(1) + 1 = 3$\n$a_3 = 2a_2 + 1 = 2(3) + 1 = 7$\n$a_4 = 2a_3 + 1 = 2(7) + 1 = 15$","d":"خرداد ۱۴۰۴","t":"fb","a":"الف) a_4 - 9b_5 = 1 - 6 = -5  |  ب) a_2 = 3, a_3 = 7, a_4 = 15"},{"i":13,"q":"دنباله‌های a_n = 3^(3-n) و b_n = 1 / (n + 1) داده شده است. حاصل a_2 + 5b_4 را به دست آورید.","x":"مقادیر $a_2$ و $b_4$ را به دست می‌آوریم:\n$a_2 = 3^{3-2} = 3^1 = 3$\n$b_4 = \\frac{1}{4 + 1} = \\frac{1}{5}$\nحاصل عبارت:\n$a_2 + 5b_4 = 3 + 5 \\times \\frac{1}{5} = 3 + 1 = 4$","d":"دی ۱۴۰۳","t":"fb","a":"a_2 + 5b_4 = 3 + 1 = 4"},{"i":14,"q":"رابطهٔ بازگشتی a_{n+1} = a_n + n و a_1 = 1 داده شده است.\nالف. چهار جملهٔ اول دنباله را بنویسید.\nب. نمودار دنباله را برای n <= 4 رسم کنید.","x":"الف) با جایگذاری $n = 1, 2, 3$ در رابطهٔ بازگشتی $a_{n+1} = a_n + n$:\n$a_1 = 1$\n$a_2 = a_1 + 1 = 1 + 1 = 2$\n$a_3 = a_2 + 2 = 2 + 2 = 4$\n$a_4 = a_3 + 3 = 4 + 3 = 7$\nپس چهار جملهٔ اول عبارت‌اند از: $1, 2, 4, 7$.\n\nب) برای رسم نمودار دنباله، نقاط $(1, 1)$، $(2, 2)$، $(3, 4)$ و $(4, 7)$ را در دستگاه مختصات دکارتی علامت می‌زنیم (چون دامنه اعداد طبیعی است، نقاط را به هم وصل نمی‌کنیم).","d":"دی ۱۴۰۳","t":"fb","a":"الف) 1, 2, 4, 7  |  ب) رسم نقاط (1, 1), (2, 2), (3, 4), (4, 7) در دستگاه مختصات"},{"i":15,"q":"با توجه به دنباله‌های a_n = (-1)^n / (n + 1) و b_n = n^2 + 2 حاصل عبارت b_2 + 8a_3 را بنویسید.","x":"مقادیر $b_2$ و $a_3$ را محاسبه می‌کنیم:\n$b_2 = 2^2 + 2 = 4 + 2 = 6$\n$a_3 = \\frac{(-1)^3}{3 + 1} = \\frac{-1}{4} = -\\frac{1}{4}$\nحاصل عبارت:\n$b_2 + 8a_3 = 6 + 8 \\times \\left(-\\frac{1}{4}\\right) = 6 - 2 = 4$","d":"خرداد ۱۴۰۳","t":"fb","a":"b_2 + 8a_3 = 6 + 8 * (-1/4) = 6 - 2 = 4"},{"i":16,"q":"در دنبالهٔ بازگشتی a_{n+1} = 2a_n + n با جملهٔ اول a_1 = 3، چهار جملهٔ اول را به دست آورید.","x":"با جایگذاری $n = 1, 2, 3$ در $a_{n+1} = 2a_n + n$ با فرض $a_1 = 3$:\n$a_1 = 3$\n$a_2 = 2a_1 + 1 = 2(3) + 1 = 7$\n$a_3 = 2a_2 + 2 = 2(7) + 2 = 16$\n$a_4 = 2a_3 + 3 = 2(16) + 3 = 35$\nچهار جملهٔ اول: $3, 7, 16, 35$.","d":"خرداد ۱۴۰۳","t":"fb","a":"3, 7, 16, 35"},{"i":17,"q":"پنج جملهٔ اول دنبالهٔ بازگشتی a_1 = a_2 = 1 , a_{n+2} = a_{n+1} + a_n را بنویسید.","x":"با استفاده از رابطهٔ بازگشتی $a_{n+2} = a_{n+1} + a_n$ و $a_1 = a_2 = 1$:\n$a_1 = 1$ ، $a_2 = 1$\n$a_3 = a_2 + a_1 = 1 + 1 = 2$\n$a_4 = a_3 + a_2 = 2 + 1 = 3$\n$a_5 = a_4 + a_3 = 3 + 2 = 5$\nپنج جملهٔ اول: $1, 1, 2, 3, 5$.","d":"شهریور ۱۴۰۳","t":"fb","a":"1, 1, 2, 3, 5"},{"i":18,"q":"اگر a_n = 3^n و b_n = (-1/2)^(n+1) باشد، حاصل a_2 * b_1 را بیابید.","x":"مقادیر $a_2$ و $b_1$ را می‌یابیم:\n$a_2 = 3^2 = 9$\n$b_1 = \\left(-\\frac{1}{2}\\right)^{1+1} = \\left(-\\frac{1}{2}\\right)^2 = \\frac{1}{4}$\nحاصل ضرب:\n$a_2 \\times b_1 = 9 \\times \\frac{1}{4} = \\frac{9}{4}$","d":"دی ۱۴۰۲","t":"fb","a":"a_2 * b_1 = 9 * (1/4) = 9/4"},{"i":19,"q":"با توجه به دنباله‌های a_n = (-1)^(n+1) / 2 , b_n = n^2 + 1 حاصل عبارت b_3 + 2a_1 را بنویسید.","x":"مقادیر $b_3$ و $a_1$ را محاسبه می‌کنیم:\n$b_3 = 3^2 + 1 = 9 + 1 = 10$\n$a_1 = \\frac{(-1)^{1+1}}{2} = \\frac{(-1)^2}{2} = \\frac{1}{2}$\nحاصل عبارت:\n$b_3 + 2a_1 = 10 + 2 \\times \\frac{1}{2} = 10 + 1 = 11$","d":"خرداد ۱۴۰۲","t":"fb","a":"b_3 + 2a_1 = 10 + 1 = 11"},{"i":20,"q":"جملهٔ پنجم دنبالهٔ بازگشتی زیر را مشخص کنید.\na_1 = a_2 = a_3 = 1   a_{n+3} = a_n + a_{n+1} + a_{n+2}","x":"با قرار دادن $n = 1$ و $n = 2$ در رابطهٔ بازگشتی $a_{n+3} = a_n + a_{n+1} + a_{n+2}$:\n$a_4 = a_1 + a_2 + a_3 = 1 + 1 + 1 = 3$\n$a_5 = a_2 + a_3 + a_4 = 1 + 1 + 3 = 5$\nبنابراین جملهٔ پنجم برابر $5$ است.","d":"خرداد ۱۴۰۲","t":"fb","a":"a_4 = 3, a_5 = 5"},{"i":21,"q":"با توجه به دنباله‌های a_n = (1/5)^(n-3) و b_n = 3n - 2 حاصل عبارت a_3 - b_2 را بیابید.","x":"مقادیر $a_3$ و $b_2$ را حساب می‌کنیم:\n$a_3 = \\left(\\frac{1}{5}\\right)^{3-3} = \\left(\\frac{1}{5}\\right)^0 = 1$\n$b_2 = 3(2) - 2 = 6 - 2 = 4$\nحاصل عبارت:\n$a_3 - b_2 = 1 - 4 = -3$","d":"شهریور ۱۴۰۲","t":"fb","a":"a_3 - b_2 = 1 - 4 = -3"},{"i":22,"q":"جمله‌های دوم تا پنجم دنبالهٔ بازگشتی { a_1 = 2 , a_{n+1} = a_n + n } را مشخص کنید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $a_{n+1} = a_n + n$ با فرض $a_1 = 2$:\n$a_2 = a_1 + 1 = 2 + 1 = 3$\n$a_3 = a_2 + 2 = 3 + 2 = 5$\n$a_4 = a_3 + 3 = 5 + 3 = 8$\n$a_5 = a_4 + 4 = 8 + 4 = 12$","d":"شهریور ۱۴۰۲","t":"fb","a":"a_2 = 3, a_3 = 5, a_4 = 8, a_5 = 12"},{"i":23,"q":"با توجه به دنباله‌های a_n = (2n - 1) / (n + 1)، حاصل عبارت c_3 + a_2 - b_3 را بیابید. c_n = (-1/2)^(n-1), b_n = 2n^2 + 1 و","x":"مقادیر $c_3$، $a_2$ و $b_3$ را به دست می‌آوریم:\n$c_3 = \\left(-\\frac{1}{2}\\right)^{3-1} = \\left(-\\frac{1}{2}\\right)^2 = \\frac{1}{4}$\n$a_2 = \\frac{2(2) - 1}{2 + 1} = \\frac{3}{3} = 1$\n$b_3 = 2(3^2) + 1 = 2(9) + 1 = 19$\nحاصل عبارت:\n$c_3 + a_2 - b_3 = \\frac{1}{4} + 1 - 19 = \\frac{1}{4} - 18 = -\\frac{71}{4}$","d":"دی ۱۴۰۱","t":"fb","a":"c_3 + a_2 - b_3 = 1/4 + 1 - 19 = -71/4"},{"i":24,"q":"به سوالات زیر پاسخ دهید.\nالف. چهار جملهٔ اول دنبالهٔ a_n = 3n + 2 را بنویسید.\nب. رابطهٔ بازگشتی دنبالهٔ 5 و 11 و 17 و ... را بنویسید.","x":"الف) با جایگذاری $n = 1, 2, 3, 4$ در $a_n = 3n + 2$:\n$a_1 = 3(1) + 2 = 5$ ، $a_2 = 3(2) + 2 = 8$ ، $a_3 = 3(3) + 2 = 11$ ، $a_4 = 3(4) + 2 = 14$\n\nب) در دنبالهٔ $5, 11, 17, \\dots$ جملهٔ اول $5$ است و هر جمله نسبت به جملهٔ قبلی $6$ واحد افزایش می‌یابد؛ پس رابطهٔ بازگشتی آن:\n$a_1 = 5 \\quad , \\quad a_{n+1} = a_n + 6$","d":"خرداد ۱۴۰۱","t":"fb","a":"الف) 5, 8, 11, 14  |  ب) a_1 = 5 , a_{n+1} = a_n + 6"},{"i":25,"q":"با توجه به دنباله‌های a_n = 3^n و b_n = n^2 + 5 و c_n = (-1)^n / (n - 2)؛ حاصل عبارت a_2 - b_5 - c_3 را به دست آورید.","x":"مقادیر $a_2$، $b_5$ و $c_3$ را حساب می‌کنیم:\n$a_2 = 3^2 = 9$\n$b_5 = 5^2 + 5 = 25 + 5 = 30$\n$c_3 = \\frac{(-1)^3}{3 - 2} = \\frac{-1}{1} = -1$\nحاصل عبارت:\n$a_2 - b_5 - c_3 = 9 - 30 - (-1) = -21 + 1 = -20$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"a_2 - b_5 - c_3 = 9 - 30 - (-1) = -20"},{"i":26,"q":"چهار جملهٔ اول دنبالهٔ بازگشتی a_1 = -2 , a_{n+1} = a_n + 5 را بنویسید.","x":"با جایگذاری $n = 1, 2, 3$ در $a_{n+1} = a_n + 5$ با فرض $a_1 = -2$:\n$a_1 = -2$ ، $a_2 = -2 + 5 = 3$ ، $a_3 = 3 + 5 = 8$ ، $a_4 = 8 + 5 = 13$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"-2, 3, 8, 13"},{"i":27,"q":"با توجه به دنباله‌های a_n = 2n / (n + 3) و b_n = 4^(n-1) و c_n = (1/5)^(n-1)، حاصل عبارت a_3 + b_2 + c_1 را به دست آورید.","x":"مقادیر $a_3$، $b_2$ و $c_1$ را می‌یابیم:\n$a_3 = \\frac{2(3)}{3 + 3} = \\frac{6}{6} = 1$\n$b_2 = 4^{2-1} = 4^1 = 4$\n$c_1 = \\left(\\frac{1}{5}\\right)^{1-1} = \\left(\\frac{1}{5}\\right)^0 = 1$\nحاصل عبارت:\n$a_3 + b_2 + c_1 = 1 + 4 + 1 = 6$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"a_3 + b_2 + c_1 = 1 + 4 + 1 = 6"},{"i":28,"q":"به سوالات زیر پاسخ دهید.\nالف. چهار جملهٔ اول دنبالهٔ بازگشتی a_1 = 2 , a_{n+1} = a_n + 3 را بنویسید.\nب. ضابطهٔ تابعی این دنباله را بنویسید.","x":"الف) با جایگذاری $n = 1, 2, 3$ در $a_{n+1} = a_n + 3$ با فرض $a_1 = 2$:\n$a_1 = 2$ ، $a_2 = 2 + 3 = 5$ ، $a_3 = 5 + 3 = 8$ ، $a_4 = 8 + 3 = 11$\n\nب) دنبالهٔ $2, 5, 8, 11, \\dots$ یک دنبالهٔ حسابی با $a_1 = 2$ و اختلاف مشترک $d = 3$ است:\n$a_n = a_1 + (n - 1)d = 2 + (n - 1) \\times 3 = 3n - 1$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"الف) 2, 5, 8, 11  |  ب) a_n = 3n - 1"},{"i":29,"q":"رابطهٔ بازگشتی دنبالهٔ 10, 17, 24, ... را بنویسید.","x":"در دنبالهٔ $10, 17, 24, \\dots$ جملهٔ اول برابر $10$ است و اختلاف هر جمله با جملهٔ قبلی برابر $7$ است؛ پس رابطهٔ بازگشتی عبارت است از:\n$a_1 = 10 \\quad , \\quad a_{n+1} = a_n + 7$","d":"شهریور ۱۴۰۱","t":"fb","a":"a_1 = 10 , a_{n+1} = a_n + 7"},{"i":30,"q":"چهار جملهٔ اول دنباله a_n = n^2 + 1 را بنویسید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $a_n = n^2 + 1$:\n$a_1 = 1^2 + 1 = 2$ ، $a_2 = 2^2 + 1 = 5$ ، $a_3 = 3^2 + 1 = 10$ ، $a_4 = 4^2 + 1 = 17$","d":"شهریور ۱۴۰۱","t":"fb","a":"2, 5, 10, 17"},{"i":31,"q":"برای جملات دنبالهٔ زیر، رابطهٔ بازگشتی بنویسید. 5, 10, 15, ...","x":"در دنبالهٔ $5, 10, 15, \\dots$ جملهٔ اول $5$ است و هر جمله $5$ واحد به جملهٔ قبلی اضافه می‌کند؛ بنابراین رابطهٔ بازگشتی آن:\n$a_1 = 5 \\quad , \\quad a_{n+1} = a_n + 5$","d":"دی ۱۴۰۰","t":"fb","a":"a_1 = 5 , a_{n+1} = a_n + 5"},{"i":32,"q":"با توجه به دنباله‌های c_n = n / 2 , a_n = (2n - 1) / (n - 2) , b_n = n^2 حاصل عبارت a_3 + b_5 + c_4 را به دست آورید.","x":"مقادیر $a_3$، $b_5$ و $c_4$ را به دست می‌آوریم:\n$a_3 = \\frac{2(3) - 1}{3 - 2} = \\frac{5}{1} = 5$\n$b_5 = 5^2 = 25$\n$c_4 = \\frac{4}{2} = 2$\nحاصل عبارت:\n$a_3 + b_5 + c_4 = 5 + 25 + 2 = 32$","d":"دی ۱۴۰۰","t":"fb","a":"a_3 + b_5 + c_4 = 5 + 25 + 2 = 32"},{"i":33,"q":"جدول زیر را کامل کنید. (ضابطهٔ دنباله: a_n = 2n + 1 | فرمول بازگشتی: ... | ۴ جملهٔ اول دنباله: ...)","x":"ابتدا ۴ جملهٔ اول را از ضابطهٔ $a_n = 2n + 1$ می‌یابیم:\n$a_1 = 2(1) + 1 = 3$ ، $a_2 = 2(2) + 1 = 5$ ، $a_3 = 2(3) + 1 = 7$ ، $a_4 = 2(4) + 1 = 9$\nچون جملهٔ اول $3$ است و هر جمله $2$ واحد بیشتر از جملهٔ قبلی است، فرمول بازگشتی به صورت زیر است:\n$a_1 = 3 \\quad , \\quad a_{n+1} = a_n + 2$","d":"خرداد ۱۴۰۰","t":"fb","a":"فرمول بازگشتی: a_1 = 3 , a_{n+1} = a_n + 2  |  ۴ جملهٔ اول دنباله: 3, 5, 7, 9"},{"i":34,"q":"با توجه به دنباله‌های a_n = 2^(2n+1) و b_n = 15 / (n + 1) و c_n = (1/2)^(n-2) حاصل عبارت a_1 - b_4 + c_2 را به دست آورید.","x":"مقادیر $a_1$، $b_4$ و $c_2$ را حساب می‌کنیم:\n$a_1 = 2^{2(1)+1} = 2^3 = 8$\n$b_4 = \\frac{15}{4 + 1} = \\frac{15}{5} = 3$\n$c_2 = \\left(\\frac{1}{2}\\right)^{2-2} = \\left(\\frac{1}{2}\\right)^0 = 1$\nحاصل عبارت:\n$a_1 - b_4 + c_2 = 8 - 3 + 1 = 6$","d":"خرداد ۱۴۰۰","t":"fb","a":"a_1 - b_4 + c_2 = 8 - 3 + 1 = 6"},{"i":35,"q":"جملهٔ عمومی (ضابطهٔ تابعی) یک دنباله به صورت a_n = (n + 1) / n است. چهار جملهٔ اول این دنباله را بنویسید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در ضابطهٔ $a_n = \\frac{n + 1}{n}$:\n$a_1 = \\frac{1 + 1}{1} = 2$ ، $a_2 = \\frac{2 + 1}{2} = \\frac{3}{2}$ ، $a_3 = \\frac{3 + 1}{3} = \\frac{4}{3}$ ، $a_4 = \\frac{4 + 1}{4} = \\frac{5}{4}$","d":"شهریور ۱۴۰۰","t":"fb","a":"2, 3/2, 4/3, 5/4"},{"i":36,"q":"برای جملات دنبالهٔ زیر:\n3, 8, 13, 18, 23, ...\nالف. رابطهٔ بازگشتی دنباله را بنویسید.\nب. ضابطهٔ تابعی دنباله را به دست آورید.","x":"الف) در دنبالهٔ $3, 8, 13, 18, 23, \\dots$ جملهٔ اول $3$ است و هر جمله $5$ واحد از جملهٔ قبلی بزرگ‌تر است:\n$a_1 = 3 \\quad , \\quad a_{n+1} = a_n + 5$\n\nب) چون دنباله حسابی با $a_1 = 3$ و $d = 5$ است، ضابطهٔ تابعی آن:\n$a_n = a_1 + (n - 1)d = 3 + (n - 1) \\times 5 = 5n - 2$","d":"دی ۹۹","t":"fb","a":"الف) a_1 = 3 , a_{n+1} = a_n + 5  |  ب) a_n = 5n - 2"},{"i":37,"q":"جملهٔ پنجم از دنبالهٔ بازگشتی زیر را بنویسید.\na_1 = a_2 = a_3 = 2   a_{n+3} = a_n + a_{n+1} + a_{n+2}","x":"با قرار دادن $n = 1$ و $n = 2$ در رابطهٔ بازگشتی $a_{n+3} = a_n + a_{n+1} + a_{n+2}$:\n$a_4 = a_1 + a_2 + a_3 = 2 + 2 + 2 = 6$\n$a_5 = a_2 + a_3 + a_4 = 2 + 2 + 6 = 10$\nبنابراین جملهٔ پنجم برابر $10$ است.","d":"دی ۹۹","t":"fb","a":"a_4 = 6, a_5 = 10"},{"i":38,"q":"برای جملات دنباله 3, 9, 27, 81, 243, ...:\nالف. رابطهٔ بازگشتی را مشخص کنید.\nب. ضابطهٔ تابعی را به دست آورید.","x":"الف) در دنبالهٔ $3, 9, 27, 81, 243, \\dots$ جملهٔ اول $3$ است و هر جمله $3$ برابر جملهٔ قبلی است:\n$a_1 = 3 \\quad , \\quad a_{n+1} = 3a_n$\n\nب) جملات توان‌های متوالی عدد $3$ هستند ($3^1, 3^2, 3^3, \\dots$)؛ پس ضابطهٔ تابعی:\n$a_n = 3^n$","d":"دی ۹۹ خارج","t":"fb","a":"الف) a_1 = 3 , a_{n+1} = 3a_n  |  ب) a_n = 3^n"},{"i":39,"q":"چهار جملهٔ اول دنبالهٔ a_n = 1 / (3n + 1) را بنویسید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $a_n = \\frac{1}{3n + 1}$:\n$a_1 = \\frac{1}{3(1)+1} = \\frac{1}{4}$ ، $a_2 = \\frac{1}{3(2)+1} = \\frac{1}{7}$ ، $a_3 = \\frac{1}{3(3)+1} = \\frac{1}{10}$ ، $a_4 = \\frac{1}{3(4)+1} = \\frac{1}{13}$","d":"دی ۹۹ خارج","t":"fb","a":"1/4, 1/7, 1/10, 1/13"},{"i":40,"q":"با توجه به دنباله‌های a_n = 2n و b_n = n^2 - 1 و c_n = n + 5 حاصل عبارت a_7 + b_3 - c_6 را به دست آورید.","x":"مقادیر $a_7$، $b_3$ و $c_6$ را می‌یابیم:\n$a_7 = 2(7) = 14$\n$b_3 = 3^2 - 1 = 9 - 1 = 8$\n$c_6 = 6 + 5 = 11$\nحاصل عبارت:\n$a_7 + b_3 - c_6 = 14 + 8 - 11 = 11$","d":"دی ۹۹ خارج","t":"fb","a":"a_7 + b_3 - c_6 = 14 + 8 - 11 = 11"},{"i":41,"q":"جملهٔ عمومی یک دنبالهٔ بازگشتی به صورت a_1 = 2 و a_{n+1} = a_n + 5 است. جملات دوم و سوم این دنباله را بنویسید.","x":"با استفاده از رابطهٔ بازگشتی $a_{n+1} = a_n + 5$ و $a_1 = 2$:\n$a_2 = a_1 + 5 = 2 + 5 = 7$\n$a_3 = a_2 + 5 = 7 + 5 = 12$","d":"دی ۹۹ خارج","t":"fb","a":"a_2 = 7, a_3 = 12"},{"i":42,"q":"جملات دنبالهٔ -1, -4, -9, -16, ... را در نظر بگیرید.\nالف. ضابطهٔ تابعی را برای جملات این دنباله بنویسید.\nب. جملهٔ دهم این دنباله چند است؟","x":"الف) هر جمله قرینهٔ مجذور شمارهٔ جمله است؛ پس ضابطهٔ تابعی برابر $a_n = -n^2$ است.\n\nب) با جایگذاری $n = 10$:\n$a_{10} = -(10)^2 = -100$","d":"دی ۹۹ خارج","t":"fb","a":"الف) a_n = -n^2  |  ب) a_{10} = -100"},{"i":43,"q":"با توجه به دنباله‌های a_n = 3^n , b_n = n^2 + 1 و c_n = 1 / (n + 2)، حاصل عبارت a_3 + b_2 - 3c_1 را به دست آورید.","x":"مقادیر $a_3$، $b_2$ و $c_1$ را محاسبه می‌کنیم:\n$a_3 = 3^3 = 27$\n$b_2 = 2^2 + 1 = 4 + 1 = 5$\n$c_1 = \\frac{1}{1 + 2} = \\frac{1}{3} \\Rightarrow 3c_1 = 3 \\times \\frac{1}{3} = 1$\nحاصل عبارت:\n$a_3 + b_2 - 3c_1 = 27 + 5 - 1 = 31$","d":"دی ۹۹ خارج","t":"fb","a":"a_3 + b_2 - 3c_1 = 27 + 5 - 1 = 31"},{"i":44,"q":"با توجه به جملات دنبالهٔ زیر به سوالات زیر پاسخ دهید.\n9, 3, 1, 1/3, ...\nالف. رابطهٔ بازگشتی را بنویسید.\nب. ضابطهٔ دنباله را به دست آورید.","x":"الف) در دنبالهٔ $9, 3, 1, \\frac{1}{3}, \\dots$ جملهٔ اول $9$ است و هر جمله $\\frac{1}{3}$ برابر جملهٔ قبلی است:\n$a_1 = 9 \\quad , \\quad a_{n+1} = \\frac{1}{3}a_n$\n\nب) با توجه به الگوی توان‌های عدد $3$:\n$a_n = 9 \\times \\left(\\frac{1}{3}\\right)^{n-1} = 3^2 \\times 3^{1-n} = 3^{3-n}$","d":"خرداد ۹۹","t":"fb","a":"الف) a_1 = 9 , a_{n+1} = (1/3)a_n  |  ب) a_n = 9 * (1/3)^(n-1) = 3^(3-n)"},{"i":45,"q":"پنج جملهٔ اول دنبالهٔ a_{n+1} = -a_n + (-1)^n را با فرض a_1 = 3 بنویسید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $a_{n+1} = -a_n + (-1)^n$ با فرض $a_1 = 3$:\n$a_1 = 3$\n$a_2 = -a_1 + (-1)^1 = -3 - 1 = -4$\n$a_3 = -a_2 + (-1)^2 = -(-4) + 1 = 4 + 1 = 5$\n$a_4 = -a_3 + (-1)^3 = -5 - 1 = -6$\n$a_5 = -a_4 + (-1)^4 = -(-6) + 1 = 6 + 1 = 7$\nپنج جملهٔ اول: $3, -4, 5, -6, 7$.","d":"خرداد ۹۹","t":"fb","a":"3, -4, 5, -6, 7"},{"i":46,"q":"با توجه به دنباله‌های a_n = n^2 / (-1)^n , b_n = n + 4 و c_n = n / 2 حاصل عبارت a_1 + b_8 - c_2 را به دست آورید.","x":"مقادیر $a_1$، $b_8$ و $c_2$ را حساب می‌کنیم:\n$a_1 = \\frac{1^2}{(-1)^1} = \\frac{1}{-1} = -1$\n$b_8 = 8 + 4 = 12$\n$c_2 = \\frac{2}{2} = 1$\nحاصل عبارت:\n$a_1 + b_8 - c_2 = -1 + 12 - 1 = 10$","d":"خرداد ۹۹","t":"fb","a":"a_1 + b_8 - c_2 = -1 + 12 - 1 = 10"},{"i":47,"q":"چهار جملهٔ اول دنبالهٔ a_n = (-1/2)^n را به دست آورید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $a_n = \\left(-\\frac{1}{2}\\right)^n$:\n$a_1 = -\\frac{1}{2}$ ، $a_2 = \\frac{1}{4}$ ، $a_3 = -\\frac{1}{8}$ ، $a_4 = \\frac{1}{16}$","d":"خرداد ۹۹","t":"fb","a":"-1/2, 1/4, -1/8, 1/16"},{"i":48,"q":"برای جملات دنبالهٔ زیر:\n1, 4, 7, 10, 13, ...\nالف. رابطهٔ بازگشتی دنباله را بنویسید.\nب. ضابطهٔ تابعی دنباله را به دست آورید.","x":"الف) در دنبالهٔ $1, 4, 7, 10, 13, \\dots$ جملهٔ اول $1$ است و هر جمله $3$ واحد از جملهٔ قبلی بزرگ‌تر است:\n$a_1 = 1 \\quad , \\quad a_{n+1} = a_n + 3$\n\nب) دنباله حسابی با $a_1 = 1$ و $d = 3$ است:\n$a_n = a_1 + (n - 1)d = 1 + (n - 1) \\times 3 = 3n - 2$","d":"شهریور ۹۹","t":"fb","a":"الف) a_1 = 1 , a_{n+1} = a_n + 3  |  ب) a_n = 3n - 2"},{"i":49,"q":"با توجه به دنباله‌های a_n = (n + 6) / (3n - 2) و b_n = n^2 - 1 حاصل عبارت a_2 + b_4 را به دست آورید.","x":"مقادیر $a_2$ و $b_4$ را به دست می‌آوریم:\n$a_2 = \\frac{2 + 6}{3(2) - 2} = \\frac{8}{6 - 2} = \\frac{8}{4} = 2$\n$b_4 = 4^2 - 1 = 16 - 1 = 15$\nحاصل عبارت:\n$a_2 + b_4 = 2 + 15 = 17$","d":"شهریور ۹۹","t":"fb","a":"a_2 + b_4 = 2 + 15 = 17"},{"i":50,"q":"چهار جملهٔ اول دنبالهٔ c_n = 1 / n را بنویسید.","x":"با جایگذاری $n = 1, 2, 3, 4$ در $c_n = \\frac{1}{n}$:\n$c_1 = 1$ ، $c_2 = \\frac{1}{2}$ ، $c_3 = \\frac{1}{3}$ ، $c_4 = \\frac{1}{4}$","d":"شهریور ۹۹","t":"fb","a":"1, 1/2, 1/3, 1/4"},{"i":51,"q":"با توجه به دنباله‌های a_n = (n + 6) / n , b_n = n^2 , c_n = (3)^(n-2) حاصل عبارت a_3 + b_4 - c_2 را به دست آورید.","x":"مقادیر $a_3$، $b_4$ و $c_2$ را حساب می‌کنیم:\n$a_3 = \\frac{3 + 6}{3} = \\frac{9}{3} = 3$\n$b_4 = 4^2 = 16$\n$c_2 = 3^{2-2} = 3^0 = 1$\nحاصل عبارت:\n$a_3 + b_4 - c_2 = 3 + 16 - 1 = 18$","d":"دی ۹۸","t":"fb","a":"a_3 + b_4 - c_2 = 3 + 16 - 1 = 18"},{"i":52,"q":"با توجه به دنباله‌های b_n = (-1/2)^(n/2 - 1) , c_n = 1 / (3n - 1) , d_n = n^2 + 1 حاصل عبارت c_1 - d_2 + b_4 را به دست آورید.","x":"مقادیر $c_1$، $d_2$ و $b_4$ را محاسبه می‌کنیم:\n$c_1 = \\frac{1}{3(1) - 1} = \\frac{1}{2}$\n$d_2 = 2^2 + 1 = 4 + 1 = 5$\n$b_4 = \\left(-\\frac{1}{2}\\right)^{\\frac{4}{2} - 1} = \\left(-\\frac{1}{2}\\right)^{2 - 1} = \\left(-\\frac{1}{2}\\right)^1 = -\\frac{1}{2}$\nحاصل عبارت:\n$c_1 - d_2 + b_4 = \\frac{1}{2} - 5 + \\left(-\\frac{1}{2}\\right) = -5$","d":"خرداد ۹۸","t":"fb","a":"c_1 - d_2 + b_4 = 1/2 - 5 + (-1/2) = -5"},{"i":53,"q":"با توجه به دنباله‌های a_n = (8 - n) / (n + 2) و b_n = 3^(n-1) و c_n = (1/2)^(n-1)، حاصل عبارت a_3 + b_2 + c_1 را به دست آورید.","x":"مقادیر $a_3$، $b_2$ و $c_1$ را می‌یابیم:\n$a_3 = \\frac{8 - 3}{3 + 2} = \\frac{5}{5} = 1$\n$b_2 = 3^{2-1} = 3^1 = 3$\n$c_1 = \\left(\\frac{1}{2}\\right)^{1-1} = \\left(\\frac{1}{2}\\right)^0 = 1$\nحاصل عبارت:\n$a_3 + b_2 + c_1 = 1 + 3 + 1 = 5$","d":"شهریور ۹۸","t":"fb","a":"a_3 + b_2 + c_1 = 1 + 3 + 1 = 5"}]},{"n":"فصل ۲ · دنباله‌های حسابی","q":[{"i":1,"q":"دنبالهٔ 1, 3, 6, 10, ... یک دنبالهٔ حسابی است.","x":"نادرست؛ تفاضل جملات متوالی ثابت نیست ($3 - 1 = 2$ در حالی که $6 - 3 = 3$ است)، پس دنباله حسابی نیست.","d":"خرداد ۱۴۰۴","t":"tf","a":false},{"i":2,"q":"هر دنبالهٔ حسابی یک تابع خطی است که شیب خط، همان اختلاف مشترک جملات دنباله، یعنی d است.","x":"درست؛ جملهٔ عمومی دنبالهٔ حسابی به صورت $a_n = dn + (a_1 - d)$ یک تابع خطی با دامنهٔ $\\mathbb{N}$ است که شیب خط آن برابر اختلاف مشترک ($d$) می‌باشد.","d":"شهریور ۱۴۰۳","t":"tf","a":true},{"i":3,"q":"دنبالهٔ 1, 4, 9, 16, ... یک دنبالهٔ حسابی است.","x":"نادرست؛ تفاضل جملات متوالی برابر نیست ($4 - 1 = 3$ در حالی که $9 - 4 = 5$ است)، بنابراین دنباله حسابی نیست.","d":"خرداد ۱۴۰۳","t":"tf","a":false},{"i":4,"q":"هر دنبالهٔ حسابی یک تابع خطی است که شیب خط آن، همان اختلاف مشترک جملات دنباله، یعنی d است.","x":"درست؛ هر دنبالهٔ حسابی از یک تابع خطی به ازای اعداد طبیعی ساخته می‌شود و شیب آن همان اختلاف مشترک ($d$) است.","d":"خرداد ۱۴۰۲","t":"tf","a":true},{"i":5,"q":"اگر در یک دنبالهٔ حسابی اختلاف مشترک (d) عددی مثبت باشد، جملات دنباله کاهشی می‌شود.","x":"نادرست؛ اگر اختلاف مشترک مثبت باشد ($d > 0$)، هر جمله از جملهٔ قبلی بزرگ‌تر می‌شود و دنباله **افزایشی** است (کاهشی بودن مربوط به $d < 0$ است).","d":"شهریور ۱۴۰۲","t":"tf","a":false},{"i":6,"q":"اختلاف مشترک در دنبالهٔ اعداد 2, 5, 8, 12, ... برابر ۳ است.","x":"نادرست؛ تفاضل جملات متوالی ثابت نیست ($5 - 2 = 3$ و $8 - 5 = 3$ اما $12 - 8 = 4$)؛ پس این دنباله اصلاً دنبالهٔ حسابی نیست.","d":"دی ۱۴۰۱","t":"tf","a":false},{"i":7,"q":"هر دنبالهٔ حسابی، یک تابع خطی است که شیب آن همان اختلاف مشترک جملات دنباله است.","x":"درست؛ نمودار یک دنبالهٔ حسابی روی یک خط راست قرار می‌گیرد که شیب آن برابر اختلاف مشترک ($d$) جملات است.","d":"شهریور ۱۴۰۱","t":"tf","a":true},{"i":8,"q":"دنبالهٔ -2, 0, 3, 6, ... یک دنبالهٔ حسابی است.","x":"نادرست؛ $0 - (-2) = 2$ اما $3 - 0 = 3$؛ چون تفاضل جملات متوالی یکسان نیست، دنباله حسابی نیست.","d":"شهریور ۱۴۰۱","t":"tf","a":false},{"i":9,"q":"دنبالهٔ ساخته‌شده از یک تابع خطی، جملات یک دنبالهٔ ........... را مشخص می‌کنند.","x":"مقادیر یک تابع خطی به ازای اعداد طبیعی ($n = 1, 2, 3, \\dots$) همواره یک دنبالهٔ **حسابی** تشکیل می‌دهند.","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"حسابی"},{"i":10,"q":"جملهٔ چهارم دنبالهٔ a_n = (1/2)n - 5/2، برابر با ........... می‌باشد.","x":"با جایگذاری $n = 4$ در ضابطهٔ $a_n = \\frac{1}{2}n - \\frac{5}{2}$ داریم:\n$a_4 = \\frac{1}{2}(4) - \\frac{5}{2} = 2 - \\frac{5}{2} = -\\frac{1}{2}$","d":"خرداد ۹۸","t":"fb","a":"-1/2"},{"i":11,"q":"بین دو عدد ۳ و ۱۹ ........... واسطهٔ حسابی با اختلاف مشترک ۴ می‌توان نوشت.","x":"در درج $k$ واسطهٔ حسابی بین دو عدد $a = 3$ و $b = 19$ با اختلاف مشترک $d = 4$:\n$b - a = (k + 1)d \\Rightarrow 19 - 3 = (k + 1) \\times 4 \\Rightarrow 16 = 4(k + 1) \\Rightarrow k + 1 = 4 \\Rightarrow k = 3$\nپس ۳ واسطهٔ حسابی (اعداد ۷، ۱۱ و ۱۵) می‌توان نوشت.","d":"شهریور ۹۸","t":"fb","a":"۳"},{"i":12,"q":"در یک دنبالهٔ حسابی، a_9 - a_5 = 28 می‌باشد. اختلاف مشترک این دنباله کدام است؟","x":"با استفاده از رابطهٔ تفاضل دو جمله در دنبالهٔ حسابی:\n$a_9 - a_5 = (9 - 5)d = 4d = 28 \\Rightarrow d = \\frac{28}{4} = 7$\nکه برابر **گزینه «الف»** است.","d":"دی ۱۴۰۳","t":"fb","a":"گزینه «الف»"},{"i":13,"q":"با مصرف یک قرص آسپرین، ۲۵۰ میلی‌گرم دارو به بدن شخصی وارد می‌شود و پس از پایان هر یک ساعت، ۱۵ میلی‌گرم دارو در سطح خونش کاهش می‌یابد. چند ساعت پس از مصرف دارو، سطح آن در بدنش ۱۳۰ میلی‌گرم می‌شود؟","x":"مقدار دارو در بدن پس از $t$ ساعت یک دنبالهٔ حسابی با جملهٔ اول $250$ و اختلاف مشترک $d = -15$ است:\n$a_n = 250 + (n - 1)(-15) = 130 \\Rightarrow (n - 1)(-15) = -120 \\Rightarrow n - 1 = 8 \\Rightarrow n = 9$\nنکتهٔ مهم در شمارش ساعات: جملهٔ اول ($n = 1$) در لحظهٔ مصرف ($t = 0$) برابر $250$ است و جملهٔ نهم ($n = 9$) پس از $8$ ساعت ($t = 8$) رخ می‌دهد (یا با مدل خطی مستقیم $250 - 15t = 130 \\Rightarrow t = 8$). طبق کلید پاسخ، **گزینه «ب»** صحیح است.","d":"شهریور ۱۴۰۲","t":"fb","a":"گزینه «ب»"},{"i":14,"q":"جملهٔ سوم یک دنبالهٔ حسابی ۱۴ و جملهٔ دهم آن ۴۹ است. جملهٔ اول و اختلاف مشترک این دنباله را با نوشتن راه‌حل به دست آورید.","x":"ابتدا اختلاف مشترک $d$ را از تفاضل جملات دهم و سوم می‌یابیم:\n$a_{10} - a_3 = (10 - 3)d = 7d \\Rightarrow 49 - 14 = 7d \\Rightarrow 7d = 35 \\Rightarrow d = 5$\nحال با جایگذاری $d = 5$ در رابطهٔ $a_3 = a_1 + 2d$:\n$14 = a_1 + 2(5) \\Rightarrow 14 = a_1 + 10 \\Rightarrow a_1 = 4$","d":"خرداد ۱۴۰۴","t":"fb","a":"d = 5 , a_1 = 4"},{"i":15,"q":"در پاسخ به موارد این سؤال، نوشتن فرمول الزامی است.\nالف. در یک دنبالهٔ حسابی جملهٔ اول ۴ و اختلاف مشترک آن ۳ است. کدام جملهٔ دنباله برابر با ۱۴۸ است؟\nب. در یک سالن، در ردیف اول ۱۰ صندلی، ردیف دوم ۱۳ صندلی و ردیف سوم ۱۶ صندلی چیده شده است. اگر صندلی‌های هر ردیف با همین نظم اضافه شوند، آنگاه مجموع صندلی‌های چیده‌شده در ۲۰ ردیف اول را حساب کنید.","x":"الف) با نوشتن فرمول جملهٔ عمومی دنبالهٔ حسابی ($a_n = a_1 + (n - 1)d$) و جایگذاری $a_1 = 4$ و $d = 3$:\n$148 = 4 + (n - 1) \\times 3 \\Rightarrow 144 = 3(n - 1) \\Rightarrow n - 1 = 48 \\Rightarrow n = 49$\nپس جملهٔ چهل‌ونهم ($n = 49$) برابر ۱۴۸ است.\n\nب) تعداد صندلی‌های ردیف‌ها دنبالهٔ حسابی با $a_1 = 10$، $d = 13 - 10 = 3$ و $n = 20$ است. با فرمول مجموع $n$ جملهٔ اول:\n$S_n = \\frac{n}{2}[2a_1 + (n - 1)d]$\n$S_{20} = \\frac{20}{2}[2(10) + (20 - 1) \\times 3] = 10 \\times [20 + 19 \\times 3] = 10 \\times (20 + 57) = 10 \\times 77 = 770$","d":"خرداد ۱۴۰۴","t":"fb","a":"الف) n = 49 (جمله چهل‌ونهم)  |  ب) S_{20} = 770"},{"i":16,"q":"دنبالهٔ حسابی مقابل داده شده است. -1, 4, 9, ...\nالف. جملهٔ چندم این دنباله برابر با ۱۴۴ می‌باشد؟\nب. مجموع بیست جملهٔ اول دنباله را با استفاده از فرمول مجموع جملات، به دست آورید.","x":"الف) در دنبالهٔ $-1, 4, 9, \\dots$ داریم $a_1 = -1$ و $d = 4 - (-1) = 5$. با فرمول جملهٔ عمومی:\n$a_n = a_1 + (n - 1)d \\Rightarrow 144 = -1 + (n - 1) \\times 5 \\Rightarrow 145 = 5(n - 1) \\Rightarrow n - 1 = 29 \\Rightarrow n = 30$\nپس جملهٔ سی‌ام برابر ۱۴۴ است.\n\nب) با فرمول مجموع $n$ جملهٔ اول برای $n = 20$:\n$S_{20} = \\frac{20}{2}[2(-1) + (20 - 1) \\times 5] = 10 \\times [-2 + 95] = 10 \\times 93 = 930$","d":"دی ۱۴۰۳","t":"fb","a":"الف) n = 30 (جمله سی‌ام)  |  ب) S_{20} = 930"},{"i":17,"q":"جدول زیر را کامل کنید. (ضابطهٔ تابع: y = -2x + 1 | جملهٔ عمومی دنبالهٔ ساخته‌شده از تابع: ... | سه جملهٔ اول دنباله: ...)","x":"با جایگذاری $n$ به جای $x$ در ضابطهٔ تابع $y = -2x + 1$، جملهٔ عمومی دنباله برابر است با:\n$a_n = -2n + 1$\nسه جملهٔ اول دنباله:\n$a_1 = -2(1) + 1 = -1$\n$a_2 = -2(2) + 1 = -3$\n$a_3 = -2(3) + 1 = -5$","d":"دی ۱۴۰۳","t":"fb","a":"جملهٔ عمومی دنباله: a_n = -2n + 1  |  سه جملهٔ اول دنباله به ترتیب از چپ به راست: -1, -3, -5"},{"i":18,"q":"در یک دنبالهٔ حسابی، جملهٔ هفتم برابر ۵۳ و جملهٔ بیست‌وپنجم برابر ۱۰۷ است.\nالف. جملهٔ اول و اختلاف مشترک دنباله را حساب کنید.\nب. جملهٔ پنجاه‌ویکم دنباله را مشخص کنید.","x":"الف) از تفاضل جملهٔ بیست‌وپنجم و هفتم:\n$a_{25} - a_7 = (25 - 7)d = 18d \\Rightarrow 107 - 53 = 18d \\Rightarrow 18d = 54 \\Rightarrow d = 3$\nبا جایگذاری $d = 3$ در $a_7 = a_1 + 6d$:\n$53 = a_1 + 6(3) \\Rightarrow 53 = a_1 + 18 \\Rightarrow a_1 = 35$\n\nب) جملهٔ پنجاه‌ویکم:\n$a_{51} = a_1 + 50d = 35 + 50(3) = 35 + 150 = 185$","d":"خرداد ۱۴۰۳","t":"fb","a":"الف) d = 3 , a_1 = 35  |  ب) a_{51} = 185"},{"i":19,"q":"بین اعداد ۷ و ۲۷ سه عدد را طوری قرار دهید که این پنج عدد با هم، تشکیل دنبالهٔ حسابی افزایشی دهند.","x":"با قرار دادن ۳ عدد بین $7$ و $27$، یک دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 7$ و $a_5 = 27$ تشکیل می‌شود:\n$a_5 = a_1 + 4d \\Rightarrow 27 = 7 + 4d \\Rightarrow 4d = 20 \\Rightarrow d = 5$\nبنابراین سه عدد میانی عبارت‌اند از: $7 + 5 = 12$ ، $12 + 5 = 17$ و $17 + 5 = 22$ (دنباله: $7, 12, 17, 22, 27$).","d":"خرداد ۱۴۰۳","t":"fb","a":"d = 5 ؛ دنباله: 7, 12, 17, 22, 27"},{"i":20,"q":"مدت‌زمان مطالعهٔ روزانهٔ دانش‌آموزی در درس ریاضی و آمار برحسب دقیقه به‌صورت دنبالهٔ زیر است.\n10, 15, 20, 25, ...\nمجموع مدت‌زمان مطالعهٔ دانش‌آموز در شانزده روز اول را بیابید. (با استفاده از فرمول مجموع)","x":"دنبالهٔ زمان مطالعه یک دنبالهٔ حسابی با $a_1 = 10$، $d = 15 - 10 = 5$ و $n = 16$ است. با فرمول مجموع:\n$S_{16} = \\frac{16}{2}[2(10) + (16 - 1) \\times 5] = 8 \\times [20 + 15 \\times 5] = 8 \\times (20 + 75) = 8 \\times 95 = 760$ دقیقه.","d":"خرداد ۱۴۰۳","t":"fb","a":"S_{16} = 760 دقیقه"},{"i":21,"q":"به سؤالات زیر پاسخ دهید.\nالف. دنبالهٔ حسابی 1, 5, 9, ..., 105 چند جمله دارد؟\nب. مجموع ده جملهٔ اول این دنباله را با استفاده از فرمول به دست آورید.","x":"الف) در دنبالهٔ حسابی $1, 5, 9, \\dots, 105$ داریم $a_1 = 1$ و $d = 5 - 1 = 4$. برای یافتن تعداد جملات ($n$):\n$a_n = a_1 + (n - 1)d \\Rightarrow 105 = 1 + (n - 1) \\times 4 \\Rightarrow 104 = 4(n - 1) \\Rightarrow n - 1 = 26 \\Rightarrow n = 27$\n\nب) مجموع ده جملهٔ اول با فرمول:\n$S_{10} = \\frac{10}{2}[2(1) + (10 - 1) \\times 4] = 5 \\times [2 + 9 \\times 4] = 5 \\times (2 + 36) = 5 \\times 38 = 190$","d":"شهریور ۱۴۰۳","t":"fb","a":"الف) n = 27 جمله  |  ب) S_{10} = 190"},{"i":22,"q":"در یک دنبالهٔ حسابی، جملهٔ دهم برابر ۲۵ و جملهٔ پانزدهم برابر ۴۰ می‌باشد. جملهٔ اول و اختلاف مشترک دنباله را حساب کنید.","x":"از تفاضل جملهٔ پانزدهم و دهم:\n$a_{15} - a_{10} = (15 - 10)d = 5d \\Rightarrow 40 - 25 = 5d \\Rightarrow 5d = 15 \\Rightarrow d = 3$\nبا جایگذاری $d = 3$ در $a_{10} = a_1 + 9d$:\n$25 = a_1 + 9(3) \\Rightarrow 25 = a_1 + 27 \\Rightarrow a_1 = -2$","d":"شهریور ۱۴۰۳","t":"fb","a":"d = 3 , a_1 = -2"},{"i":23,"q":"نمودار یک دنبالهٔ حسابی به‌صورت مقابل است. سه جملهٔ اول این دنباله را بنویسید. (نقاط روی نمودار: (1, 3), (2, 2), (3, 1), (4, 0))","x":"در نمودار دنباله، مختصات هر نقطه به صورت $(n, a_n)$ است؛ بنابراین:\n$a_1 = 3$ ، $a_2 = 2$ ، $a_3 = 1$","d":"شهریور ۱۴۰۳","t":"fb","a":"a_1 = 3 , a_2 = 2 , a_3 = 1"},{"i":24,"q":"سه عدد را به‌گونه‌ای میان اعداد ۱۰ و ۲۶ قرار دهید که یک دنبالهٔ حسابی تشکیل دهند.","x":"با قرار دادن ۳ عدد بین $10$ و $26$، دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 10$ و $a_5 = 26$ تشکیل می‌شود:\n$a_5 = a_1 + 4d \\Rightarrow 26 = 10 + 4d \\Rightarrow 4d = 16 \\Rightarrow d = 4$\nسه عدد میانی عبارت‌اند از: $14$ ، $18$ و $22$ (دنباله: $10, 14, 18, 22, 26$).","d":"دی ۱۴۰۲","t":"fb","a":"d = 4 ؛ اعداد: 14, 18, 22 (دنباله: 10, 14, 18, 22, 26)"},{"i":25,"q":"یک طراح برای یک سینما در ردیف اول ۱۵ صندلی و در ردیف دوم ۱۸ صندلی و در ردیف سوم ۲۱ صندلی مشخص کرده است. اگر صندلی‌های هر ردیف با همین نظم اضافه شوند، برای این سالن با ۱۶۸ صندلی، باید چند ردیف صندلی داشته باشیم؟","x":"تعداد صندلی‌های ردیف‌ها دنبالهٔ حسابی با $a_1 = 15$، $d = 18 - 15 = 3$ و مجموع $S_n = 168$ است:\n$S_n = \\frac{n}{2}[2a_1 + (n - 1)d] \\Rightarrow 168 = \\frac{n}{2}[30 + 3(n - 1)] \\Rightarrow 336 = n(3n + 27)\n$با تقسیم طرفین بر $3$:\n$112 = n(n + 9) \\Rightarrow n^2 + 9n - 112 = 0 \\Rightarrow (n - 7)(n + 16) = 0$\nچون تعداد ردیف‌ها نمی‌تواند منفی باشد، $n = 7$ ردیف به دست می‌آید.","d":"دی ۱۴۰۲","t":"fb","a":"n = 7 ردیف صندلی"},{"i":26,"q":"با توجه به نمودار دنبالهٔ داده‌شده، با نوشتن اعضای دنباله، جملهٔ عمومی آن را بنویسید. (نقاط روی نمودار: (1, 1), (2, 3), (3, 5), (4, 7))","x":"با خواندن مختصات نقاط روی نمودار $(1, 1), (2, 3), (3, 5), (4, 7)$، اعضای دنباله عبارت‌اند از:\n$1, 3, 5, 7, \\dots$\nاین دنباله یک دنبالهٔ حسابی با $a_1 = 1$ و $d = 3 - 1 = 2$ است؛ بنابراین جملهٔ عمومی آن:\n$a_n = a_1 + (n - 1)d = 1 + (n - 1) \\times 2 = 2n - 1$","d":"خرداد ۱۴۰۲","t":"fb","a":"اعضای دنباله: 1, 3, 5, 7, ...  |  جملهٔ عمومی: a_n = 2n - 1"},{"i":27,"q":"یازدهمین جملهٔ یک دنبالهٔ حسابی ۴۷ و جملهٔ هفدهم آن ۷۷ است. جملهٔ اول این دنباله را به دست آورید.","x":"از تفاضل جملهٔ هفدهم و یازدهم:\n$a_{17} - a_{11} = (17 - 11)d = 6d \\Rightarrow 77 - 47 = 6d \\Rightarrow 6d = 30 \\Rightarrow d = 5$\nبا جایگذاری $d = 5$ در $a_{11} = a_1 + 10d$:\n$47 = a_1 + 10(5) \\Rightarrow 47 = a_1 + 50 \\Rightarrow a_1 = -3$","d":"خرداد ۱۴۰۲","t":"fb","a":"d = 5 , a_1 = -3"},{"i":28,"q":"در دنبالهٔ حسابی زیر:\n2, 5, 8, 11, ...\nالف. جملهٔ چندم آن ۹۵ است؟\nب. مجموع چهل جملهٔ اول این دنباله را به دست آورید.","x":"الف) در دنبالهٔ $2, 5, 8, 11, \\dots$ داریم $a_1 = 2$ و $d = 5 - 2 = 3$:\n$a_n = a_1 + (n - 1)d \\Rightarrow 95 = 2 + (n - 1) \\times 3 \\Rightarrow 93 = 3(n - 1) \\Rightarrow n - 1 = 31 \\Rightarrow n = 32$\nپس جملهٔ سی‌ودوم برابر ۹۵ است.\n\nب) مجموع چهل جملهٔ اول:\n$S_{40} = \\frac{40}{2}[2(2) + (40 - 1) \\times 3] = 20 \\times [4 + 39 \\times 3] = 20 \\times (4 + 117) = 20 \\times 121 = 2420$","d":"خرداد ۱۴۰۲","t":"fb","a":"الف) n = 32 (جمله سی‌ودوم)  |  ب) S_{40} = 2420"},{"i":29,"q":"در دنبالهٔ حسابی 1, 5, 9, ..., 401:\nالف. جملهٔ عمومی دنباله را بنویسید.\nب. مجموع جملات دنباله را به دست آورید.","x":"الف) در دنبالهٔ حسابی $1, 5, 9, \\dots, 401$ داریم $a_1 = 1$ و $d = 5 - 1 = 4$:\n$a_n = a_1 + (n - 1)d = 1 + (n - 1) \\times 4 = 4n - 3$\n\nب) ابتدا تعداد جملات ($n$) را با قرار دادن $a_n = 401$ می‌یابیم:\n$4n - 3 = 401 \\Rightarrow 4n = 404 \\Rightarrow n = 101$\nحال با فرمول مجموع جملات متناهی ($S_n = \\frac{n}{2}(a_1 + a_n)$):\n$S_{101} = \\frac{101}{2}(1 + 401) = \\frac{101}{2} \\times 402 = 101 \\times 201 = 20301$","d":"شهریور ۱۴۰۲","t":"fb","a":"الف) a_n = 4n - 3  |  ب) n = 101 و S_{101} = 20301"},{"i":30,"q":"میان دو عدد ۱۲ و ۵۲ چهار عدد را به‌گونه‌ای قرار دهید که شش جملهٔ حاصل، یک دنبالهٔ حسابی افزایشی تشکیل دهند.","x":"با درج ۴ عدد میان $12$ و $52$، یک دنبالهٔ حسابی ۶ جمله‌ای با $a_1 = 12$ و $a_6 = 52$ تشکیل می‌شود:\n$a_6 = a_1 + 5d \\Rightarrow 52 = 12 + 5d \\Rightarrow 5d = 40 \\Rightarrow d = 8$\nچهار عدد میانی برابر $20, 28, 36, 44$ هستند (دنباله: $12, 20, 28, 36, 44, 52$).","d":"شهریور ۱۴۰۲","t":"fb","a":"d = 8 ؛ دنباله: 12, 20, 28, 36, 44, 52"},{"i":31,"q":"اگر ضابطهٔ تابعی (جملهٔ عمومی) دنباله‌ای، a_n = 2n - 1 باشد:\nالف. ۳ جملهٔ اول دنباله را بنویسید.\nب. رابطهٔ بازگشتی دنباله را مشخص کنید.\nج. نمودار دنباله را برای ۳ جملهٔ اول رسم کنید.","x":"الف) با جایگذاری $n = 1, 2, 3$ در $a_n = 2n - 1$:\n$a_1 = 2(1) - 1 = 1$ ، $a_2 = 2(2) - 1 = 3$ ، $a_3 = 2(3) - 1 = 5$\n\nب) جملهٔ اول $1$ است و هر جمله نسبت به جملهٔ قبلی $2$ واحد اضافه می‌شود:\n$a_1 = 1 \\quad , \\quad a_{n+1} = a_n + 2$\n\nج) نقاط $(1, 1)$، $(2, 3)$ و $(3, 5)$ را در دستگاه مختصات رسم می‌کنیم.","d":"دی ۱۴۰۱","t":"fb","a":"الف) 1, 3, 5  |  ب) a_1 = 1 , a_{n+1} = a_n + 2  |  ج) رسم نقاط (1, 1), (2, 3), (3, 5)"},{"i":32,"q":"جملهٔ اول یک دنبالهٔ حسابی ۵ و جملهٔ دهم آن ۳۲ است:\nالف. اختلاف مشترک را بیابید.\nب. مجموع ۲۰ جملهٔ اول آن را به دست آورید.","x":"الف) با استفاده از $a_{10} = a_1 + 9d$:\n$32 = 5 + 9d \\Rightarrow 27 = 9d \\Rightarrow d = 3$\n\nب) مجموع ۲۰ جملهٔ اول:\n$S_{20} = \\frac{20}{2}[2(5) + (20 - 1) \\times 3] = 10 \\times [10 + 57] = 10 \\times 67 = 670$","d":"دی ۱۴۰۱","t":"fb","a":"الف) d = 3  |  ب) S_{20} = 670"},{"i":33,"q":"در یک دنبالهٔ حسابی، جملهٔ اول ۵ و اختلاف مشترک برابر ۷ است.\nالف. جملهٔ یازدهم این دنباله را به دست آورید.\nب. کدام جملهٔ دنباله، برابر با ۹۶ است؟","x":"الف) با فرمول جملهٔ عمومی برای $a_1 = 5$ و $d = 7$:\n$a_{11} = a_1 + 10d = 5 + 10(7) = 5 + 70 = 75$\n\nب) برای یافتن شمارهٔ جملهٔ برابر با $96$:\n$96 = 5 + (n - 1) \\times 7 \\Rightarrow 91 = 7(n - 1) \\Rightarrow n - 1 = 13 \\Rightarrow n = 14$\nپس جملهٔ چهاردهم برابر ۹۶ است.","d":"خرداد ۱۴۰۱","t":"fb","a":"الف) a_{11} = 75  |  ب) n = 14 (جمله چهاردهم)"},{"i":34,"q":"در دنبالهٔ حسابی 3 و 7 و 11 و 15 و ...، مجموع بیست جملهٔ اول این دنباله را به دست آورید.","x":"در دنبالهٔ حسابی $3, 7, 11, 15, \\dots$ داریم $a_1 = 3$، $d = 7 - 3 = 4$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(3) + (20 - 1) \\times 4] = 10 \\times [6 + 76] = 10 \\times 82 = 820$","d":"خرداد ۱۴۰۱","t":"fb","a":"S_{20} = 820"},{"i":35,"q":"مجموع جملات دنبالهٔ حسابی زیر را به دست آورید.\n1, 5, 9, ..., 401","x":"ابتدا تعداد جملات دنبالهٔ حسابی $1, 5, 9, \\dots, 401$ را با $a_1 = 1$ و $d = 4$ محاسبه می‌کنیم:\n$401 = 1 + (n - 1) \\times 4 \\Rightarrow 400 = 4(n - 1) \\Rightarrow n - 1 = 100 \\Rightarrow n = 101$\nحال مجموع جملات را می‌یابیم:\n$S_{101} = \\frac{101}{2}(1 + 401) = 101 \\times 201 = 20301$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"n = 101 , S_{101} = 20301"},{"i":36,"q":"سه عدد را به‌گونه‌ای میان اعداد ۲ و ۱۴ قرار دهید که اعداد حاصل دنبالهٔ حسابی با اختلاف مشترک مثبت تشکیل دهند.","x":"با درج ۳ عدد بین $2$ و $14$، یک دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 2$ و $a_5 = 14$ تشکیل می‌شود:\n$a_5 = a_1 + 4d \\Rightarrow 14 = 2 + 4d \\Rightarrow 4d = 12 \\Rightarrow d = 3$\nسه عدد میانی عبارت‌اند از: $5, 8, 11$ (دنباله: $2, 5, 8, 11, 14$).","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"d = 3 ؛ دنباله: 2, 5, 8, 11, 14"},{"i":37,"q":"در یک دنبالهٔ حسابی جملهٔ اول ۱۰ و اختلاف مشترک ۱۸ است. جملهٔ بیست‌ویکم این دنباله را به دست آورید.","x":"با فرمول جملهٔ عمومی برای $a_1 = 10$ و $d = 18$:\n$a_{21} = a_1 + 20d = 10 + 20(18) = 10 + 360 = 370$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"a_{21} = 370"},{"i":38,"q":"مجموع جملات دنبالهٔ حسابی 5, 11, 17, ..., 149 را به دست آورید.","x":"در دنبالهٔ حسابی $5, 11, 17, \\dots, 149$ داریم $a_1 = 5$ و $d = 11 - 5 = 6$. ابتدا تعداد جملات ($n$) را به دست می‌آوریم:\n$149 = 5 + (n - 1) \\times 6 \\Rightarrow 144 = 6(n - 1) \\Rightarrow n - 1 = 24 \\Rightarrow n = 25$\nحال مجموع جملات را محاسبه می‌کنیم:\n$S_{25} = \\frac{25}{2}(5 + 149) = \\frac{25}{2} \\times 154 = 25 \\times 77 = 1925$","d":"خرداد ۱۴۰۱ خارج","t":"fb","a":"n = 25 , S_{25} = 1925"},{"i":39,"q":"در یک دنبالهٔ حسابی با جملهٔ اول ۳ و اختلاف مشترک ۶:\nالف. جملهٔ پانزدهم را به دست آورید.\nب. مجموع ده جملهٔ اول را به دست آورید.","x":"الف) با $a_1 = 3$ و $d = 6$:\n$a_{15} = a_1 + 14d = 3 + 14(6) = 3 + 84 = 87$\n\nب) مجموع ده جملهٔ اول:\n$S_{10} = \\frac{10}{2}[2(3) + (10 - 1) \\times 6] = 5 \\times [6 + 54] = 5 \\times 60 = 300$","d":"شهریور ۱۴۰۱","t":"fb","a":"الف) a_{15} = 87  |  ب) S_{10} = 300"},{"i":40,"q":"سه عدد را به‌گونه‌ای میان دو عدد ۱۰ و ۲۲ قرار دهید که یک دنبالهٔ حسابی با اختلاف مشترک مثبت تشکیل شود.","x":"با درج ۳ عدد بین $10$ و $22$، دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 10$ و $a_5 = 22$ شکل می‌گیرد:\n$a_5 = a_1 + 4d \\Rightarrow 22 = 10 + 4d \\Rightarrow 4d = 12 \\Rightarrow d = 3$\nسه عدد میانی عبارت‌اند از: $13, 16, 19$ (دنباله: $10, 13, 16, 19, 22$).","d":"شهریور ۱۴۰۱","t":"fb","a":"d = 3 ؛ دنباله: 10, 13, 16, 19, 22"},{"i":41,"q":"جملهٔ یازدهم یک دنبالهٔ حسابی ۳۲ و جملهٔ نوزدهم آن ۷۲ است. جملهٔ سی‌ام این دنباله را مشخص کنید.","x":"از تفاضل جملهٔ نوزدهم و یازدهم:\n$a_{19} - a_{11} = (19 - 11)d = 8d \\Rightarrow 72 - 32 = 8d \\Rightarrow 8d = 40 \\Rightarrow d = 5$\nبا جایگذاری $d = 5$ در $a_{11} = a_1 + 10d$:\n$32 = a_1 + 10(5) \\Rightarrow 32 = a_1 + 50 \\Rightarrow a_1 = -18$\nاکنون جملهٔ سی‌ام را می‌یابیم:\n$a_{30} = a_1 + 29d = -18 + 29(5) = -18 + 145 = 127$","d":"دی ۱۴۰۰","t":"fb","a":"d = 5 , a_1 = -18 , a_{30} = 127"},{"i":42,"q":"در یک دنبالهٔ حسابی جملهٔ اول ۲۵ و اختلاف مشترک ۱۰ است. کدام جمله از دنباله برابر ۲۲۵ است؟","x":"با جایگذاری $a_1 = 25$ و $d = 10$ در فرمول جملهٔ عمومی:\n$225 = 25 + (n - 1) \\times 10 \\Rightarrow 200 = 10(n - 1) \\Rightarrow n - 1 = 20 \\Rightarrow n = 21$\nپس جملهٔ بیست‌ویکم برابر ۲۲۵ است.","d":"دی ۱۴۰۰","t":"fb","a":"n = 21 (جمله بیست‌ویکم)"},{"i":43,"q":"مجموع بیست جملهٔ اول دنبالهٔ حسابی زیر را به دست آورید.\n4, 10, 16, 22, ...","x":"در دنبالهٔ حسابی $4, 10, 16, 22, \\dots$ داریم $a_1 = 4$، $d = 10 - 4 = 6$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(4) + (20 - 1) \\times 6] = 10 \\times [8 + 114] = 10 \\times 122 = 1220$","d":"دی ۱۴۰۰","t":"fb","a":"S_{20} = 1220"},{"i":44,"q":"کدام‌یک از جملات عمومی زیر مربوط به دنبالهٔ حسابی است؟ اختلاف مشترک آن را به دست آورید.\nالف. a_n = n(n - 1)\nب. b_n = 3(n - 2)","x":"ضابطهٔ الف) $a_n = n(n - 1) = n^2 - n$ یک عبارت درجهٔ دوم بر حسب $n$ است و خطی نیست؛ پس دنبالهٔ حسابی ایجاد نمی‌کند.\nضابطهٔ ب) $b_n = 3(n - 2) = 3n - 6$ یک ضابطهٔ خطی بر حسب $n$ است، پس مربوط به یک **دنبالهٔ حسابی** است و ضریب $n$ برابر اختلاف مشترک آن یعنی **$d = 3$** می‌باشد.","d":"خرداد ۱۴۰۰","t":"fb","a":"ب) b_n = 3(n - 2) = 3n - 6 دنبالهٔ حسابی است و اختلاف مشترک آن d = 3 می‌باشد."},{"i":45,"q":"در یک دنبالهٔ حسابی، جملهٔ اول ۱۷- و جملهٔ دهم برابر با ۱۰ است. جملهٔ عمومی این دنباله را به دست آورید.","x":"با جایگذاری $a_1 = -17$ و $a_{10} = 10$ در فرمول جملهٔ عمومی:\n$a_{10} = a_1 + 9d \\Rightarrow 10 = -17 + 9d \\Rightarrow 27 = 9d \\Rightarrow d = 3$\nبنابراین جملهٔ عمومی دنباله:\n$a_n = -17 + (n - 1) \\times 3 = 3n - 20$","d":"خرداد ۱۴۰۰","t":"fb","a":"d = 3 , a_n = 3n - 20"},{"i":46,"q":"در دنبالهٔ حسابی زیر، مجموع ۱۶ جملهٔ اول را به دست آورید.\n11, 8, 5, ...","x":"در دنبالهٔ حسابی $11, 8, 5, \\dots$ داریم $a_1 = 11$، $d = 8 - 11 = -3$ و $n = 16$:\n$S_{16} = \\frac{16}{2}[2(11) + (16 - 1)(-3)] = 8 \\times [22 - 45] = 8 \\times (-23) = -184$","d":"خرداد ۱۴۰۰","t":"fb","a":"S_{16} = -184"},{"i":47,"q":"سه عدد را به‌گونه‌ای میان اعداد ۱۵ و ۲۳ قرار دهید که یک دنبالهٔ حسابی با اختلاف مشترک مثبت تشکیل دهند.","x":"با درج ۳ عدد بین $15$ و $23$، دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 15$ و $a_5 = 23$ تشکیل می‌شود:\n$a_5 = a_1 + 4d \\Rightarrow 23 = 15 + 4d \\Rightarrow 4d = 8 \\Rightarrow d = 2$\nسه عدد میانی عبارت‌اند از: $17, 19, 21$ (دنباله: $15, 17, 19, 21, 23$).","d":"شهریور ۱۴۰۰","t":"fb","a":"d = 2 ؛ دنباله: 15, 17, 19, 21, 23"},{"i":48,"q":"مجموع بیست جملهٔ اول دنباله حسابی زیر را با استفاده از فرمول به دست آورید.\n1, 5, 9, ...","x":"در دنبالهٔ حسابی $1, 5, 9, \\dots$ داریم $a_1 = 1$، $d = 5 - 1 = 4$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(1) + (20 - 1) \\times 4] = 10 \\times [2 + 76] = 10 \\times 78 = 780$","d":"شهریور ۱۴۰۰","t":"fb","a":"S_{20} = 780"},{"i":49,"q":"در یک دنبالهٔ حسابی جملهٔ اول برابر با ۲۵ و اختلاف مشترک برابر ۲۰ است. کدام جملهٔ دنباله، برابر ۲۲۵ است؟","x":"با قرار دادن $a_1 = 25$ و $d = 20$ در فرمول جملهٔ عمومی:\n$225 = 25 + (n - 1) \\times 20 \\Rightarrow 200 = 20(n - 1) \\Rightarrow n - 1 = 10 \\Rightarrow n = 11$\nپس جملهٔ یازدهم برابر ۲۲۵ است.","d":"شهریور ۱۴۰۰","t":"fb","a":"n = 11 (جمله یازدهم)"},{"i":50,"q":"مجموع بیست جملهٔ اول دنبالهٔ حسابی زیر را به دست آورید.\n-10, -6, -2, +2, 6, ...","x":"در دنبالهٔ حسابی $-10, -6, -2, +2, 6, \\dots$ داریم $a_1 = -10$، $d = -6 - (-10) = 4$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(-10) + (20 - 1) \\times 4] = 10 \\times [-20 + 76] = 10 \\times 56 = 560$","d":"دی ۹۹","t":"fb","a":"S_{20} = 560"},{"i":51,"q":"در یک دنبالهٔ حسابی جملهٔ اول ۱۲ و اختلاف مشترک ۲۰ است. کدام جمله از دنباله، برابر ۵۹۲ است؟","x":"با قرار دادن $a_1 = 12$ و $d = 20$ در فرمول جملهٔ عمومی:\n$592 = 12 + (n - 1) \\times 20 \\Rightarrow 580 = 20(n - 1) \\Rightarrow n - 1 = 29 \\Rightarrow n = 30$\nپس جملهٔ سی‌ام برابر ۵۹۲ است.","d":"دی ۹۹","t":"fb","a":"n = 30 (جمله سی‌ام)"},{"i":52,"q":"در یک دنبالهٔ حسابی a_4 + a_6 + a_8 = 90 باشد، جملهٔ ششم دنباله چقدر است؟","x":"با نوشتن جملات بر حسب جملهٔ ششم ($a_4 = a_6 - 2d$ و $a_8 = a_6 + 2d$) یا بر حسب $a_1$ و $d$:\n$(a_6 - 2d) + a_6 + (a_6 + 2d) = 90 \\Rightarrow 3a_6 = 90 \\Rightarrow a_6 = 30$","d":"دی ۹۹","t":"fb","a":"a_6 = 30"},{"i":53,"q":"مجموع بیست جملهٔ اول دنبالهٔ حسابی 1, 5, 9, 13, ... را به دست آورید.","x":"در دنبالهٔ حسابی $1, 5, 9, 13, \\dots$ داریم $a_1 = 1$، $d = 4$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(1) + (20 - 1) \\times 4] = 10 \\times [2 + 76] = 10 \\times 78 = 780$","d":"دی ۹۹ خارج","t":"fb","a":"S_{20} = 780"},{"i":54,"q":"در یک دنبالهٔ حسابی، جملهٔ اول برابر ۱۰ و اختلاف مشترک برابر ۱۲ است. کدام جمله برابر ۱۹۰ است؟","x":"با جایگذاری $a_1 = 10$ و $d = 12$ در فرمول جملهٔ عمومی:\n$190 = 10 + (n - 1) \\times 12 \\Rightarrow 180 = 12(n - 1) \\Rightarrow n - 1 = 15 \\Rightarrow n = 16$\nپس جملهٔ شانزدهم برابر ۱۹۰ است.","d":"دی ۹۹ خارج","t":"fb","a":"n = 16 (جمله شانزدهم)"},{"i":55,"q":"جملهٔ هشتم یک دنبالهٔ حسابی برابر ۴۵ و جملهٔ چهاردهم آن برابر ۱۳۵ است.\nالف. اختلاف مشترک و جملهٔ اول این دنباله را به دست آورید.\nب. جملهٔ سی‌ویکم این دنبالهٔ حسابی را به دست آورید.","x":"الف) از تفاضل جملهٔ چهاردهم و هشتم:\n$a_{14} - a_8 = (14 - 8)d = 6d \\Rightarrow 135 - 45 = 6d \\Rightarrow 6d = 90 \\Rightarrow d = 15$\nبا جایگذاری $d = 15$ در $a_8 = a_1 + 7d$:\n$45 = a_1 + 7(15) \\Rightarrow 45 = a_1 + 105 \\Rightarrow a_1 = -60$\n\nب) جملهٔ سی‌ویکم:\n$a_{31} = a_1 + 30d = -60 + 30(15) = -60 + 450 = 390$","d":"دی ۹۹ خارج","t":"fb","a":"الف) d = 15 , a_1 = -60  |  ب) a_{31} = 390"},{"i":56,"q":"مجموع جملات دنبالهٔ 5, 9, 13, ..., 401 را محاسبه کنید.","x":"در دنبالهٔ حسابی $5, 9, 13, \\dots, 401$ داریم $a_1 = 5$ و $d = 9 - 5 = 4$. ابتدا تعداد جملات ($n$) را می‌یابیم:\n$401 = 5 + (n - 1) \\times 4 \\Rightarrow 396 = 4(n - 1) \\Rightarrow n - 1 = 99 \\Rightarrow n = 100$\nحال مجموع جملات را حساب می‌کنیم:\n$S_{100} = \\frac{100}{2}(5 + 401) = 50 \\times 406 = 20300$","d":"دی ۹۹ خارج","t":"fb","a":"n = 100 , S_{100} = 20300"},{"i":57,"q":"هفتمین جملهٔ یک دنبالهٔ حسابی برابر ۴۵ و جملهٔ پانزدهم آن برابر ۹۳ است. جملهٔ سی‌ویکم این دنباله را به دست آورید.","x":"از تفاضل جملهٔ پانزدهم و هفتم:\n$a_{15} - a_7 = (15 - 7)d = 8d \\Rightarrow 93 - 45 = 8d \\Rightarrow 8d = 48 \\Rightarrow d = 6$\nبا جایگذاری $d = 6$ در $a_7 = a_1 + 6d$:\n$45 = a_1 + 6(6) \\Rightarrow 45 = a_1 + 36 \\Rightarrow a_1 = 9$\nبنابراین جملهٔ سی‌ویکم برابر است با:\n$a_{31} = a_1 + 30d = 9 + 30(6) = 9 + 180 = 189$","d":"خرداد ۹۹","t":"fb","a":"d = 6 , a_1 = 9 , a_{31} = 189"},{"i":58,"q":"به سؤالات زیر پاسخ دهید.\nالف. مجموع شانزده جملهٔ اول اعداد زوج را به دست آورید.\nب. در یک دنبالهٔ حسابی، جملهٔ اول ۲۵ و اختلاف مشترک برابر ۱۸ است. کدام جملهٔ دنباله برابر با ۶۰۱ است؟","x":"الف) دنبالهٔ اعداد زوج طبیعی به صورت $2, 4, 6, \\dots$ است که یک دنبالهٔ حسابی با $a_1 = 2$، $d = 2$ و $n = 16$ می‌باشد:\n$S_{16} = \\frac{16}{2}[2(2) + (16 - 1) \\times 2] = 8 \\times [4 + 30] = 8 \\times 34 = 272$\n\nب) با قرار دادن $a_1 = 25$ و $d = 18$ در فرمول جملهٔ عمومی:\n$601 = 25 + (n - 1) \\times 18 \\Rightarrow 576 = 18(n - 1) \\Rightarrow n - 1 = 32 \\Rightarrow n = 33$\nپس جملهٔ سی‌وسوم برابر ۶۰۱ است.","d":"خرداد ۹۹","t":"fb","a":"الف) S_{16} = 272 (برای اعداد زوج طبیعی 2, 4, ...)  |  ب) n = 33 (جمله سی‌وسوم)"},{"i":59,"q":"سه عدد را به‌گونه‌ای میان اعداد ۱۰ و ۲۶ قرار دهید که تشکیل یک دنبالهٔ حسابی با اختلاف مشترک مثبت بدهد. (به دست آوردن اختلاف مشترک الزامی است.)","x":"با درج ۳ عدد بین $10$ و $26$، دنبالهٔ حسابی ۵ جمله‌ای با $a_1 = 10$ و $a_5 = 26$ تشکیل می‌شود:\n$a_5 = a_1 + 4d \\Rightarrow 26 = 10 + 4d \\Rightarrow 4d = 16 \\Rightarrow d = 4$\nسه عدد میانی عبارت‌اند از: $14, 18, 22$ (دنباله: $10, 14, 18, 22, 26$).","d":"خرداد ۹۹","t":"fb","a":"d = 4 ؛ دنباله: 10, 14, 18, 22, 26"},{"i":60,"q":"مجموع سی جملهٔ اول اعداد فرد را به دست آورید.","x":"دنبالهٔ اعداد فرد طبیعی به صورت $1, 3, 5, \\dots$ است که یک دنبالهٔ حسابی با $a_1 = 1$، $d = 2$ و $n = 30$ می‌باشد:\n$S_{30} = \\frac{30}{2}[2(1) + (30 - 1) \\times 2] = 15 \\times [2 + 58] = 15 \\times 60 = 900$","d":"خرداد ۹۹","t":"fb","a":"S_{30} = 900"},{"i":61,"q":"به سؤالات زیر پاسخ دهید.\nالف. چهار جمله از دنبالهٔ زیر را بنویسید.\n{ a_{n+1} = -a_n + 4 , a_1 = -2 }\nب. آیا این دنباله، حسابی است؟","x":"الف) با جایگذاری $n = 1, 2, 3$ در رابطهٔ بازگشتی $a_{n+1} = -a_n + 4$ با فرض $a_1 = -2$:\n$a_1 = -2$\n$a_2 = -(-2) + 4 = 2 + 4 = 6$\n$a_3 = -(6) + 4 = -2$\n$a_4 = -(-2) + 4 = 6$\nچهار جملهٔ اول: $-2, 6, -2, 6$.\n\nب) خیر؛ زیرا تفاضل جملات متوالی ثابت نیست ($6 - (-2) = +8$ اما $-2 - 6 = -8$).","d":"شهریور ۹۹","t":"fb","a":"الف) -2, 6, -2, 6  |  ب) خیر، دنباله حسابی نیست."},{"i":62,"q":"در یک دنبالهٔ حسابی، جملهٔ اول ۲۵ و اختلاف مشترک ۱۸ است. کدام جمله از دنباله برابر ۶۰۱ است؟","x":"با جایگذاری $a_1 = 25$ و $d = 18$ در فرمول جملهٔ عمومی:\n$601 = 25 + (n - 1) \\times 18 \\Rightarrow 576 = 18(n - 1) \\Rightarrow n - 1 = 32 \\Rightarrow n = 33$\nپس جملهٔ سی‌وسوم برابر ۶۰۱ است.","d":"شهریور ۹۹","t":"fb","a":"n = 33 (جمله سی‌وسوم)"},{"i":63,"q":"اگر جملهٔ عمومی یک دنباله به‌صورت a_n = -5 + 3(n - 1) باشد. جملهٔ اول و اختلاف مشترک را به دست آورید.","x":"با مقایسهٔ ضابطهٔ داده شده با صورت استاندارد جملهٔ عمومی دنبالهٔ حسابی $a_n = a_1 + (n - 1)d$:\n$a_n = -5 + 3(n - 1) \\Rightarrow a_1 = -5 \\quad , \\quad d = 3$","d":"شهریور ۹۹","t":"fb","a":"a_1 = -5 , d = 3"},{"i":64,"q":"مجموع سی جملهٔ اول دنبالهٔ حسابی زیر را به دست آورید.\n-1, 4, 9, ...","x":"در دنبالهٔ حسابی $-1, 4, 9, \\dots$ داریم $a_1 = -1$، $d = 4 - (-1) = 5$ و $n = 30$:\n$S_{30} = \\frac{30}{2}[2(-1) + (30 - 1) \\times 5] = 15 \\times [-2 + 145] = 15 \\times 143 = 2145$","d":"شهریور ۹۹","t":"fb","a":"S_{30} = 2145"},{"i":65,"q":"با توجه به رابطهٔ { a_{n+1} = 5 + a_n , a_1 = -2 } مطلوب است محاسبهٔ S_{12}.","x":"رابطهٔ بازگشتی $a_{n+1} = a_n + 5$ با $a_1 = -2$ نشان‌دهندهٔ یک دنبالهٔ حسابی با $a_1 = -2$ و $d = 5$ است. برای $n = 12$:\n$S_{12} = \\frac{12}{2}[2(-2) + (12 - 1) \\times 5] = 6 \\times [-4 + 55] = 6 \\times 51 = 306$","d":"شهریور ۹۹","t":"fb","a":"S_{12} = 306"},{"i":66,"q":"مجموع بیست جملهٔ اول دنبالهٔ 4, 7, 10, ... را محاسبه کنید.","x":"در دنبالهٔ حسابی $4, 7, 10, \\dots$ داریم $a_1 = 4$، $d = 7 - 4 = 3$ و $n = 20$:\n$S_{20} = \\frac{20}{2}[2(4) + (20 - 1) \\times 3] = 10 \\times [8 + 57] = 10 \\times 65 = 650$","d":"دی ۹۸","t":"fb","a":"S_{20} = 650"},{"i":67,"q":"هشتمین جملهٔ یک دنبالهٔ حسابی برابر ۶۵ و جملهٔ شانزدهم آن برابر ۱۰۵ است. جملهٔ بیست‌ونهم این دنبالهٔ حسابی را به دست آورید.","x":"از تفاضل جملهٔ شانزدهم و هشتم:\n$a_{16} - a_8 = (16 - 8)d = 8d \\Rightarrow 105 - 65 = 8d \\Rightarrow 8d = 40 \\Rightarrow d = 5$\nبا جایگذاری $d = 5$ در $a_8 = a_1 + 7d$:\n$65 = a_1 + 7(5) \\Rightarrow 65 = a_1 + 35 \\Rightarrow a_1 = 30$\nبنابراین جملهٔ بیست‌ونهم برابر است با:\n$a_{29} = a_1 + 28d = 30 + 28(5) = 30 + 140 = 170$","d":"دی ۹۸","t":"fb","a":"d = 5 , a_1 = 30 , a_{29} = 170"},{"i":68,"q":"مجموع سی جملهٔ اول اعداد فرد را به دست آورید.","x":"دنبالهٔ اعداد فرد طبیعی به صورت $1, 3, 5, \\dots$ یک دنبالهٔ حسابی با $a_1 = 1$، $d = 2$ و $n = 30$ است:\n$S_{30} = \\frac{30}{2}[2(1) + (30 - 1) \\times 2] = 15 \\times [2 + 58] = 15 \\times 60 = 900$","d":"خرداد ۹۸","t":"fb","a":"S_{30} = 900"},{"i":69,"q":"یازدهمین جملهٔ یک دنبالهٔ حسابی برابر ۵۲ و جملهٔ نوزدهم آن برابر ۹۲ است. جملهٔ بیست‌وششم این دنبالهٔ حسابی را به دست آورید.","x":"از تفاضل جملهٔ نوزدهم و یازدهم:\n$a_{19} - a_{11} = (19 - 11)d = 8d \\Rightarrow 92 - 52 = 8d \\Rightarrow 8d = 40 \\Rightarrow d = 5$\nبا جایگذاری $d = 5$ در $a_{11} = a_1 + 10d$:\n$52 = a_1 + 10(5) \\Rightarrow 52 = a_1 + 50 \\Rightarrow a_1 = 2$\nبنابراین جملهٔ بیست‌وششم:\n$a_{26} = a_1 + 25d = 2 + 25(5) = 2 + 125 = 127$","d":"خرداد ۹۸","t":"fb","a":"d = 5 , a_1 = 2 , a_{26} = 127"},{"i":70,"q":"در یک دنبالهٔ حسابی جملهٔ نهم برابر ۶۱ و جملهٔ شانزدهم برابر ۹۶ است.\nاختلاف مشترک و جملهٔ سی‌ام این دنباله را به دست آورید.","x":"از تفاضل جملهٔ شانزدهم و نهم:\n$a_{16} - a_9 = (16 - 9)d = 7d \\Rightarrow 96 - 61 = 7d \\Rightarrow 7d = 35 \\Rightarrow d = 5$\nبا جایگذاری $d = 5$ در $a_9 = a_1 + 8d$:\n$61 = a_1 + 8(5) \\Rightarrow 61 = a_1 + 40 \\Rightarrow a_1 = 21$\nاکنون جملهٔ سی‌ام را می‌یابیم:\n$a_{30} = a_1 + 29d = 21 + 29(5) = 21 + 145 = 166$","d":"شهریور ۹۸","t":"fb","a":"d = 5 , a_1 = 21 , a_{30} = 166"},{"i":71,"q":"مجموع بیست جملهٔ اول دنبالهٔ 35, 31, 27, ... را به د
